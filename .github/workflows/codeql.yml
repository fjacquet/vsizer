# CodeQL static analysis for vsizer — see ADR-0015.
# Scans the TypeScript source on every PR + weekly.
#
# Security note (workflow injection): every `${{ ... }}` expression in
# this file references GitHub-controlled structured fields
# (github.ref). No untrusted user input (issue titles, PR bodies,
# commit messages, head_ref) is interpolated into run: blocks.

name: CodeQL

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']
  schedule:
    # Weekly, Monday 04:23 UTC — staggered from Dependabot.
    - cron: '23 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (javascript-typescript)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Initialize CodeQL
        uses: github/codeql-action/init@68bde559dea0fdcac2102bfdf6230c5f70eb485e  # v4.35.4
        with:
          languages: javascript-typescript
          queries: security-extended

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@68bde559dea0fdcac2102bfdf6230c5f70eb485e  # v4.35.4
        with:
          category: '/language:javascript-typescript'
