# vsizer container nginx config — see ADR-0013.
# Listens on 8080 (nginx-unprivileged default), serves the SPA, ships
# hardened response headers including a CSP that enforces ADR-0001
# (connect-src 'self' — same-origin only; the container exposes no
# endpoint capable of receiving workbook bytes, so the privacy
# invariant holds at runtime. See ADR-0013 update 2026-05-14).
#
# Header note: nginx silently drops inherited server-level `add_header`
# directives the moment a location block declares its own. We therefore
# include `security-headers.conf` from every location block rather than
# setting headers at server level — the alternative is invisible bugs
# whenever a location adds a Cache-Control header.

server {
    listen 8080 default_server;
    listen [::]:8080 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 256;

    # SPA fallback — vsizer is fully client-routed today, this future-proofs
    # any client-side route additions.
    location / {
        try_files $uri $uri/ /index.html;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Hashed asset bundles can cache for a year.
    location /assets/ {
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    # The entry HTML must never be cached — clients always re-fetch.
    location = /index.html {
        add_header Cache-Control "no-store" always;
        include /etc/nginx/snippets/security-headers.conf;
    }
}
