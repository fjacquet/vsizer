# OSV-Scanner ignore list — see ADR-0016 Waivers section for full rationale.
#
# Each entry must mirror a Waivers entry in
# docs/adr/0016-strict-audit-gates-all-deps-low-severity.md, including
# the same ignoreUntil expiry. Drift between this file and the ADR is
# a process bug — review at the same cadence.

[[IgnoredVulns]]
id = "GHSA-4r6h-8v6p-xvw6"
ignoreUntil = 2026-11-13
reason = """
SheetJS prototype pollution. GHSA summary says affected range is
< 0.19.3; we ship xlsx 0.20.3 via the CDN tarball (ADR-0002), so we
are PAST the fix. However the OSV.dev record has range
{introduced: 0, no fixed event}, treating every xlsx version as
vulnerable, because SheetJS is CDN-distributed and the GHSA was
never updated with a "first_patched_version" entry. Renewed 2026-08-15: re-checked
cdn.sheetjs.com, 0.20.3 is still the newest tarball published, so
there is nothing to bump to and we remain past the fix range.
Re-check before 2026-11-13 on the same terms.
"""

[[IgnoredVulns]]
id = "GHSA-5pgg-2g8v-p4x9"
ignoreUntil = 2026-11-13
reason = """
SheetJS ReDoS. GHSA summary says affected range is < 0.20.2; we ship
xlsx 0.20.3 via the CDN tarball (ADR-0002). Same OSV structured-
range gap as GHSA-4r6h-8v6p-xvw6: introduced=0, no fixed event. Not
actually vulnerable on 0.20.3. Renewed 2026-08-15: 0.20.3 is still
the newest tarball on cdn.sheetjs.com. Re-check before 2026-11-13.
"""

[[IgnoredVulns]]
id = "GHSA-5p2g-fcmc-qvqq"
ignoreUntil = 2026-11-08
reason = """
image-size JXL and HEIF parser infinite-loop denial of service.
Dependency path: root -> pptxgenjs@4.0.1 -> image-size@^1.2.1 (production).

No fix exists to upgrade to. The OSV record is
{introduced: 0, last_affected: 2.0.2} and 2.0.2 is the latest version
published on npm, so every release of image-size is affected — there is no
patched target. pptxgenjs 4.0.1 is likewise the latest release and still
declares image-size ^1.2.1, so an `overrides` pin to 2.0.2 would buy nothing.

Not reachable as an attack here: image-size is called by pptxgenjs solely to
measure images being embedded into a PPTX the user generates locally in their
own browser. Those bytes come from the user's own machine, never from a remote
or untrusted party, and the worst case is the user hanging their own tab.

Re-check at expiry: drop this waiver the moment image-size ships a patched
release or pptxgenjs stops depending on it.
"""

