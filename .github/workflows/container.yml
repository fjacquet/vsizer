# Build, smoke-test, and publish the vsizer container image to GHCR.
# See ADR-0013 and docs/superpowers/specs/2026-05-13-containerization-design.md.
#
# Security note (workflow injection): every `${{ ... }}` expression in this
# file references GitHub-controlled fields (github.repository, github.actor,
# github.ref, github.event_name) or structured outputs from
# docker/metadata-action. No untrusted user input (issue titles, PR bodies,
# commit messages, refs) is interpolated into shell run: blocks.
name: Container image

on:
  push:
    branches: ['main']
    tags: ['v*']
  pull_request:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write
  security-events: write  # ADR-0015: Trivy SARIF upload to Code Scanning

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  # Opt into Node 24 for docker/* javascript actions ahead of the 2026-06-02
  # default flip — keeps us on the latest runtime the runner offers.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8  # v4.2.0
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c  # v4.2.0

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=edge,branch=main
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,format=short
          flavor: |
            latest=auto

      # First pass: amd64 only, loaded locally for the smoke test. Push is
      # disabled here; the second pass handles publish.
      - name: Build amd64 image (local load for smoke test)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: vsizer:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test the local image
        run: |
          set -euo pipefail
          docker run -d --rm -p 8080:8080 --name vsizer-smoke vsizer:smoke
          # Wait up to 30 s for nginx to come up.
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/ > /dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8080/ > /dev/null
          echo "─── headers ───"
          curl -fsSI http://127.0.0.1:8080/
          for header in 'content-security-policy' 'cross-origin-opener-policy' 'cross-origin-embedder-policy' 'x-content-type-options' 'x-frame-options' 'referrer-policy' 'permissions-policy'; do
            if ! curl -fsSI http://127.0.0.1:8080/ | grep -qi "^$header:"; then
              echo "::error::missing response header: $header"
              docker logs vsizer-smoke
              docker stop vsizer-smoke || true
              exit 1
            fi
          done
          # ADR-0001 reinforcement. `connect-src 'self'` permits the
          # same-origin sample-workbook fetch (issue #2) but still
          # blocks every third-party connection — see ADR-0013 update
          # 2026-05-14 for why this preserves the privacy invariant.
          if ! curl -fsSI http://127.0.0.1:8080/ | grep -i 'content-security-policy:' | grep -q "connect-src 'self'"; then
            echo "::error::CSP must include connect-src 'self' (ADR-0001 enforcement)"
            docker logs vsizer-smoke
            docker stop vsizer-smoke || true
            exit 1
          fi
          docker stop vsizer-smoke

      - name: Scan image with Trivy (gate)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: vsizer:smoke
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          # Promoted from warn-only to gate (ADR-0015 §6 update 2026-05-14)
          # after the v1.4.0 nginx-unprivileged:1.29-alpine + node:26-alpine
          # bump dropped the Security-tab count from ~88 to 0. Any new
          # HIGH/CRITICAL with a fix available now fails the container build.
          exit-code: '1'
          ignore-unfixed: true

      - name: Upload Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd  # v4.37.7
        with:
          sarif_file: trivy-results.sarif
          category: trivy-image
        continue-on-error: true

      # Second pass: multi-arch, publishes only on non-PR events. Reuses the
      # GHA cache from the first pass; only arm64 is new work.
      - name: Build and publish multi-arch image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true
